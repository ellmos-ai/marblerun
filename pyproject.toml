[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "llmauto"
version = "0.1.0"
description = "MarbleRun / llmauto: local-first LLM automation framework for Claude Code agent chains"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger", email = "lukisch@users.noreply.github.com"},
]
keywords = ["llm", "automation", "claude", "claude-code", "claude-cli", "agent", "agent-chains", "multi-agent", "orchestration", "autonomous-agents", "handoff", "chain-runner", "llmauto", "marblerun", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/MarbleRun"
Repository = "https://github.com/ellmos-ai/MarbleRun"
Issues = "https://github.com/ellmos-ai/MarbleRun/issues"

[project.scripts]
llmauto = "llmauto.llmauto:main"

# Das Repo-Root IST das Paket (kein llmauto/-Unterordner, kein src-Layout):
# package-dir mappt "llmauto" auf ".", Subpackages werden explizit gelistet.
[tool.setuptools]
packages = ["llmauto", "llmauto.core", "llmauto.modes"]

[tool.setuptools.package-dir]
llmauto = "."

[tool.setuptools.package-data]
llmauto = [
    "chains/*.json",
    "prompts/*.txt",
    "templates/*.json",
    "config.json",
]
