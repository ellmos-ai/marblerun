[build-system]
requires = ["setuptools>=77.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "llmauto"
dynamic = ["version"]
description = "MarbleRun / llmauto: local-first LLM automation framework for Claude Code agent chains"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger", email = "lukisch@users.noreply.github.com"},
]
keywords = ["llm", "automation", "claude", "claude-code", "claude-cli", "agent", "agent-chains", "multi-agent", "orchestration", "autonomous-agents", "handoff", "chain-runner", "llmauto", "marblerun", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/MarbleRun"
Repository = "https://github.com/ellmos-ai/MarbleRun"
Issues = "https://github.com/ellmos-ai/MarbleRun/issues"
Documentation = "https://github.com/ellmos-ai/MarbleRun#readme"
Changelog = "https://github.com/ellmos-ai/MarbleRun/blob/main/CHANGELOG.md"

[project.scripts]
llmauto = "llmauto.llmauto:main"

[project.optional-dependencies]
providers = ["coma @ git+https://github.com/dev-bricks/coma.git"]

# Das Repo-Root IST das Paket (kein llmauto/-Unterordner, kein src-Layout):
# package-dir mappt "llmauto" auf ".", Subpackages werden explizit gelistet.
[tool.setuptools]
packages = ["llmauto", "llmauto.core", "llmauto.modes"]

[tool.setuptools.package-dir]
llmauto = "."

[tool.setuptools.package-data]
llmauto = [
    "chains/*.json",
    "prompts/*.txt",
    "templates/*.json",
    "config.json",
]

[tool.setuptools.dynamic]
version = { attr = "llmauto.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
norecursedirs = ["_archive", "build", "dist", ".git", ".pytest_cache", "legacy"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "E722", "E741", "F841"]
