[build-system]
requires = ["setuptools>=77.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "llmauto"
dynamic = ["version"]
description = "MarbleRun / llmauto: local-first LLM automation framework for Claude Code agent chains"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md", "THIRD_PARTY_LICENSES.txt"]
requires-python = ">=3.10"
authors = [
    {name = "Lukas Geiger", email = "lukisch@users.noreply.github.com"},
]
keywords = [
    "agent-chains",
    "agent-framework",
    "agent-orchestration",
    "ai-agent",
    "automation",
    "autonomous-agents",
    "chain-execution",
    "claude",
    "claude-code",
    "claude-code-cli",
    "llm",
    "llm-agents",
    "llm-automation",
    "llmauto",
    "local-first",
    "multi-agent",
    "open-source",
    "orchestration",
    "python",
    "python-cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/ellmos-ai/MarbleRun"
Repository = "https://github.com/ellmos-ai/MarbleRun"
Issues = "https://github.com/ellmos-ai/MarbleRun/issues"
Documentation = "https://github.com/ellmos-ai/MarbleRun#readme"
Changelog = "https://github.com/ellmos-ai/MarbleRun/blob/main/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/MarbleRun/blob/main/SECURITY.md"
Notice = "https://github.com/ellmos-ai/MarbleRun/blob/main/NOTICE"
Contributing = "https://github.com/ellmos-ai/MarbleRun/blob/main/CONTRIBUTING.md"
"Third-Party Licenses" = "https://github.com/ellmos-ai/MarbleRun/blob/main/THIRD_PARTY_LICENSES.md"
"Third-Party Licenses (Text)" = "https://github.com/ellmos-ai/MarbleRun/blob/main/THIRD_PARTY_LICENSES.txt"
"Level 1 SBOM" = "https://github.com/ellmos-ai/MarbleRun/blob/main/THIRD_PARTY_LICENSES.txt"
"Plain-Text License" = "https://github.com/ellmos-ai/MarbleRun/blob/main/LICENSE"
"Marketing Log" = "https://github.com/ellmos-ai/MarbleRun/blob/main/MARKETING-LOG.txt"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"

[project.scripts]
llmauto = "llmauto.llmauto:main"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
providers = ["coma @ git+https://github.com/dev-bricks/coma.git"]

# Das Repo-Root IST das Paket (kein llmauto/-Unterordner, kein src-Layout):
# package-dir mappt "llmauto" auf ".", Subpackages werden explizit gelistet.
[tool.setuptools]
packages = ["llmauto", "llmauto.core", "llmauto.modes"]

[tool.setuptools.package-dir]
llmauto = "."

[tool.setuptools.package-data]
llmauto = [
    "chains/*.json",
    "prompts/*.txt",
    "templates/*.json",
    "config.json",
]

[tool.setuptools.dynamic]
version = { attr = "llmauto.__version__" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = [".git", ".pytest_cache", "__pycache__", "build", "dist", ".venv", "venv", "_archive", "legacy", ".tox", ".pytest_tmp*", ".hypothesis", ".turbo", ".nyc_output"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra -v"


[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "E402", "E722", "E741", "F841"]
